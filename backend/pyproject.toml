[project]
name = "neighborhood-library-service"
version = "0.1.0"
description = "A neighborhood library management service built with FastAPI and PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "tortoise-orm[asyncpg]>=0.24.0",
    "aerich>=0.8.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
    "anyio[trio]>=4.0.0",
]
